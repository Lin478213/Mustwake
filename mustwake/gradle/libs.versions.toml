[versions]
agp = "9.3.2"
kotlin = "2.4.20"
compose = "1.12.0"
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
miuix = "0.9.4"
backdrop = "2.0.1"
shapes = "1.2.1"
ksp = "2.3.12"
room = "2.8.5"
datastore = "1.2.1"
coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-core = "1.7.0"
androidx-test-uiautomator = "2.4.0"
